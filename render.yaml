services:
  # 后端服务
  - type: web
    name: math-ai-review-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: AI_API_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_MAX_CONCURRENCY
        value: 4
      - key: AI_QUEUE_SIZE
        value: 32
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: REQUIRED
      - key: DB_POOL_SIZE
        value: 8
      - key: DB_POOL_ACQUIRE_TIMEOUT_MS
        value: 3000
      # Render terminates TLS and forwards the client address, so forwarded
      # headers are the only way to keep per-client rate limits meaningful.
      - key: TRUST_PROXY_HEADERS
        value: "true"

  # 前端服务（静态站点）
  - type: web
    name: math-ai-review-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # The Drogon service attaches these headers, but a static deploy bypasses it;
    # keep both hosts identical so the CSP/referrer policy cannot be lost.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
